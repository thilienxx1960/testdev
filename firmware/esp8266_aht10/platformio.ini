; ESP8266 + AHT10 Temperature/Humidity Sensor
; Publishes sensor data to HiveMQ Cloud via TLS MQTT

[env:esp8266_aht10]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    tzapu/WiFiManager@^2.0.17
    enjoyneering/AHTxx@^1.0.11

build_flags =
    -D MQTT_MAX_PACKET_SIZE=512
    -D MQTT_KEEPALIVE=30
